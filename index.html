<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Party Not Found</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-950 via-slate-950 to-indigo-950 min-h-screen text-slate-100 flex flex-col justify-between items-center antialiased p-6 relative overflow-hidden">

    <!-- Decorative Party Background Glows -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-pink-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Centered 404 Content -->
    <main class="flex-grow flex flex-col items-center justify-center text-center max-w-lg w-full my-auto py-8 relative z-10">
        
        <!-- Animated 404 Badge -->
        <div class="relative mb-4">
            <h1 class="text-8xl sm:text-9xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-indigo-400 select-none opacity-95 drop-shadow-2xl">
                404
            </h1>
        </div>

        <!-- Subtitle and Description -->
        <p class="text-slate-300 text-base sm:text-lg mb-8 max-w-md font-medium leading-relaxed">
            Looks like this page didn't make the guest list.
        </p>  

        <!-- Colin's Bear Animation Container -->
        <div class="mb-8 p-3.5 bg-slate-900/90 border border-purple-500/30 rounded-2xl shadow-2xl backdrop-blur-md flex flex-col items-center group hover:border-pink-500/50 transition-all duration-300 ring-1 ring-white/5">
            <img 
                src="https://i.imgur.com/hlnIWkQ.gif" 
                alt="Dancing Bear"
                class="w-full h-full object-cover rounded-xl group-hover:scale-[1.02] transition-transform duration-500 shadow-md"
            >
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-4xl py-4 text-center text-slate-500 text-xs relative z-10">
        <p>Thanks for nothing.</p>
    </footer>

</body>
</html>
