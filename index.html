<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Invited!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen flex flex-col justify-between">

  <!-- Hero Section -->
  <header class="max-w-xl mx-auto w-full pt-12 pb-6 px-6 text-center">
    <div class="inline-block bg-stone-200 text-stone-700 text-xs tracking-widest uppercase font-semibold px-3 py-1 rounded-full mb-4">
      Celebration
    </div>
    <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-stone-900 mb-3">
      Let's Party!
    </h1>
    <p class="text-lg text-stone-600 font-light">
      Join us for an evening of food, drinks, and great company.
    </p>
  </header>

  <!-- Event Details Card -->
  <main class="max-w-xl mx-auto w-full px-4 flex-grow">
    <div class="bg-white rounded-2xl shadow-sm border border-stone-200/80 p-6 sm:p-8 mb-6 space-y-6">
      
      <div class="flex items-start space-x-4">
        <div class="bg-stone-100 p-3 rounded-xl text-stone-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        <div>
          <h2 class="text-sm font-semibold uppercase text-stone-400 tracking-wider">When</h2>
          <p class="text-base font-medium text-stone-800">Saturday, November 14, 2026</p>
          <p class="text-sm text-stone-500">6:00 PM CST</p>
        </div>
      </div>

      <div class="border-t border-stone-100 pt-4 flex items-start space-x-4">
        <div class="bg-stone-100 p-3 rounded-xl text-stone-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </div>
        <div>
          <h2 class="text-sm font-semibold uppercase text-stone-400 tracking-wider">Where</h2>
          <p class="text-base font-medium text-stone-800">123 Event Venue Way</p>
          <p class="text-sm text-stone-500 mb-2">Chicago, IL 60601</p>
          <a href="https://maps.google.com" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-amber-700 hover:text-amber-800 underline">Open in Google Maps &rarr;</a>
        </div>
      </div>

      <!-- Add to Calendar Action -->
      <div class="border-t border-stone-100 pt-4">
        <a id="calLink" href="#" target="_blank" class="w-full inline-flex justify-center items-center py-2.5 px-4 border border-stone-300 rounded-xl text-xs font-semibold text-stone-700 bg-stone-50 hover:bg-stone-100 transition-colors">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          Add to Google Calendar
        </a>
      </div>

    </div>

    <!-- RSVP Form Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-stone-200/80 p-6 sm:p-8 mb-12">
      <h2 class="text-xl font-bold text-stone-900 mb-6 text-center">RSVP</h2>
      
      <form id="rsvpForm" class="space-y-5">
        <div>
          <label for="name" class="block text-xs font-semibold uppercase text-stone-500 mb-1">Full Name *</label>
          <input type="text" id="name" name="name" required class="w-full px-4 py-2.5 rounded-xl border border-stone-300 focus:ring-2 focus:ring-stone-800 focus:outline-none text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-stone-500 mb-2">Will you be attending? *</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center justify-center p-3 border border-stone-200 rounded-xl cursor-pointer hover:bg-stone-50 has-[:checked]:bg-stone-900 has-[:checked]:text-white has-[:checked]:border-stone-900 text-sm font-medium transition-all">
              <input type="radio" name="attending" value="Yes" required class="sr-only">
              Joyfully Accept
            </label>
            <label class="flex items-center justify-center p-3 border border-stone-200 rounded-xl cursor-pointer hover:bg-stone-50 has-[:checked]:bg-stone-900 has-[:checked]:text-white has-[:checked]:border-stone-900 text-sm font-medium transition-all">
              <input type="radio" name="attending" value="No" required class="sr-only">
              Regretfully Decline
            </label>
          </div>
        </div>

        <div>
          <label for="plusOnes" class="block text-xs font-semibold uppercase text-stone-500 mb-1">Additional Guests (Plus Ones)</label>
          <input type="number" id="plusOnes" name="plusOnes" min="0" max="5" value="0" class="w-full px-4 py-2.5 rounded-xl border border-stone-300 focus:ring-2 focus:ring-stone-800 focus:outline-none text-sm">
        </div>

        <div>
          <label for="dietary" class="block text-xs font-semibold uppercase text-stone-500 mb-1">Dietary Restrictions or Notes</label>
          <textarea id="dietary" name="dietary" rows="2" class="w-full px-4 py-2.5 rounded-xl border border-stone-300 focus:ring-2 focus:ring-stone-800 focus:outline-none text-sm" placeholder="Allergies, preferences, etc."></textarea>
        </div>

        <div>
          <label for="contactInfo" class="block text-xs font-semibold uppercase text-stone-500 mb-1">Email or Phone Number *</label>
          <input type="text" id="contactInfo" name="contactInfo" required class="w-full px-4 py-2.5 rounded-xl border border-stone-300 focus:ring-2 focus:ring-stone-800 focus:outline-none text-sm">
        </div>

        <button type="submit" id="submitBtn" class="w-full py-3.5 px-4 bg-stone-900 hover:bg-stone-800 text-white font-semibold rounded-xl text-sm transition-colors shadow-sm">
          Submit Response
        </button>
      </form>

      <!-- Status Message Display -->
      <div id="statusMsg" class="hidden mt-4 p-4 rounded-xl text-center text-sm font-medium"></div>
    </div>
  </main>

  <footer class="py-6 text-center text-xs text-stone-400">
    Hosted with care
  </footer>

  <script>
    // 1. CONFIGURATION: Paste your deployed Google Apps Script Web App URL below
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz8cRvnrCjoQ1cp8Ug15_VepaMDwE4bkQAHo8atxubo1GaUvvkD0PpwYLslTKY76LDmsA/exec';

    // 2. URL Parameter Pre-fill handling
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const guestName = urlParams.get('guest');
      if (guestName) {
        document.getElementById('name').value = decodeURIComponent(guestName);
      }

      // Generate Google Calendar Link
      const title = encodeURIComponent("Party Celebration");
      const details = encodeURIComponent("Looking forward to seeing you!");
      const location = encodeURIComponent("123 Event Venue Way, Chicago, IL 60601");
      const calUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=20261115T000000Z/20261115T040000Z&details=${details}&location=${location}`;
      document.getElementById('calLink').href = calUrl;
    });

    // 3. Form Submission Handling
    const form = document.getElementById('rsvpForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';
      statusMsg.classList.add('hidden');

      const formData = {
        name: document.getElementById('name').value,
        attending: form.elements['attending'].value,
        plusOnes: document.getElementById('plusOnes').value,
        dietary: document.getElementById('dietary').value,
        contactInfo: document.getElementById('contactInfo').value
      };

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        statusMsg.className = 'mt-4 p-4 rounded-xl text-center text-sm font-medium bg-emerald-50 text-emerald-800 border border-emerald-200';
        statusMsg.innerText = "Thank you! Your RSVP has been recorded.";
        statusMsg.classList.remove('hidden');
        form.reset();
      } catch (err) {
        statusMsg.className = 'mt-4 p-4 rounded-xl text-center text-sm font-medium bg-rose-50 text-rose-800 border border-rose-200';
        statusMsg.innerText = "An error occurred. Please try submitting again.";
        statusMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Response';
      }
    });
  </script>
</body>
</html>
